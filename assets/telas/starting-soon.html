:root{--acid:#B4FF00;--toxic:#5C9900;--acid-rgb:180,255,0;--toxic-rgb:92,153,0;--txt:#F2FFE8;--txt2:#9AA69A;--bg:#060806}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Chakra,monospace}

/* ══ FUNDO ══ */
.bgbase{position:fixed;inset:0;background:#060806;z-index:0;pointer-events:none}
.hexbg{position:fixed;inset:-120px;z-index:0;pointer-events:none;
  background-image:
    repeating-linear-gradient(0deg, rgba(var(--acid-rgb),.07) 0 1px, transparent 1px 56px),
    repeating-linear-gradient(90deg, rgba(var(--acid-rgb),.07) 0 1px, transparent 1px 56px);
  opacity:.55;animation:drift 26s linear infinite}
.hexbg.b{animation:driftb 38s linear infinite;opacity:.28;filter:blur(1px)}
.bgfilter{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:rgb(var(--acid-rgb));mix-blend-mode:color;opacity:.22}
@keyframes drift{to{transform:translate(112px,200px)}}
@keyframes driftb{to{transform:translate(-112px,-200px)}}
#rain{position:fixed;inset:0;z-index:1}
.core{position:fixed;left:50%;top:44%;width:1100px;height:1100px;transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(var(--acid-rgb),.42) 0%,rgba(var(--toxic-rgb),.10) 38%,transparent 68%);animation:corepulse 5.2s ease-in-out infinite}
@keyframes corepulse{50%{opacity:.55;transform:translate(-50%,-50%) scale(1.06)}}
.beam{position:fixed;top:-25%;height:150%;width:240px;transform:skewX(-18deg) translateX(-40vw);
  background:linear-gradient(90deg,transparent,rgba(var(--acid-rgb),.055),transparent);animation:beam 7.5s linear infinite}
.beam.b2{width:380px;animation-duration:12s;animation-delay:-6s;opacity:.6}
.beam.b3{width:140px;animation-duration:5.5s;animation-delay:-2.5s;opacity:.8}
@keyframes beam{to{transform:skewX(-18deg) translateX(150vw)}}
.scan{position:fixed;left:0;right:0;top:-170px;height:150px;
  background:linear-gradient(180deg,transparent,rgba(var(--acid-rgb),.05),transparent);animation:scan 8s linear infinite;z-index:2}
.scan.s2{height:60px;top:-70px;animation-duration:4.6s;animation-delay:-2s;opacity:.7}
.scan.s3{height:260px;top:-280px;animation-duration:13s;animation-delay:-7s;opacity:.4}
@keyframes scan{to{transform:translateY(1360px)}}
.grain{position:fixed;inset:-40px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/></svg>");opacity:.05;animation:grain 1.1s steps(4) infinite;z-index:2}
@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-14px,9px)}50%{transform:translate(11px,-13px)}75%{transform:translate(-7px,-8px)}100%{transform:translate(0,0)}}
.vig{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 44%,transparent 34%,rgba(0,0,0,.66) 100%);z-index:2}
.edge{position:fixed;inset:0;border:1px solid rgba(var(--acid-rgb),.4);z-index:2;pointer-events:none}

/* ══ RASGOS VHS ══ */
.tear{position:fixed;left:0;right:0;height:4px;background:rgba(var(--acid-rgb),.16);box-shadow:0 0 14px rgba(var(--acid-rgb),.28);opacity:0;z-index:3;animation:tear 9s linear infinite}
.tear.t1{top:18%}.tear.t2{top:64%;height:2px;animation-duration:6.5s;animation-delay:-3s}
.tear.t3{top:38%;height:8px;animation-duration:12s;animation-delay:-7s;background:rgba(242,255,232,.07)}
@keyframes tear{0%,4.4%{opacity:0;transform:translateX(-40px)}4.6%{opacity:1;transform:translateX(-24px)}5%{transform:translateX(18px)}5.4%,100%{opacity:0;transform:translateX(30px)}}

/* ══ RÉGUAS DE TICKS ══ */
.ruler{position:fixed;left:0;right:0;height:9px;z-index:2;background:repeating-linear-gradient(90deg,rgba(var(--acid-rgb),.22) 0 2px,transparent 2px 84px)}
.ruler.top{top:16px}.ruler.bot{bottom:16px;background:repeating-linear-gradient(90deg,rgba(var(--acid-rgb),.15) 0 2px,transparent 2px 118px)}

/* ══ BARRAS DE ENERGIA ══ */
.flow{position:fixed;left:0;right:0;height:7px;z-index:4;
  background:linear-gradient(90deg,transparent 0%,var(--acid) 25%,var(--toxic) 50%,var(--acid) 75%,transparent 100%);
  background-size:200% 100%;animation:flow 3.2s linear infinite,volt 5.5s steps(3) infinite;box-shadow:0 0 22px rgba(var(--acid-rgb),.5)}
.flow.top{top:0}.flow.bot{bottom:0;height:5px;animation-duration:4.1s,7s;animation-direction:reverse,normal}
@keyframes flow{to{background-position:-200% 0}}
@keyframes volt{50%{filter:brightness(1.5)}75%{filter:brightness(.8)}}

/* ══ BRACKETS ══ */
.corner{position:fixed;width:70px;height:70px;z-index:4;border:2px solid rgba(var(--acid-rgb),.55);animation:cpulse 2.6s ease-in-out infinite}
.c-tl{top:20px;left:20px;border-right:0;border-bottom:0}
.c-tr{top:20px;right:20px;border-left:0;border-bottom:0;animation-delay:.4s}
.c-bl{bottom:20px;left:20px;border-right:0;border-top:0;animation-delay:.8s}
.c-br{bottom:20px;right:20px;border-left:0;border-top:0;animation-delay:1.2s}
@keyframes cpulse{50%{opacity:.35;transform:scale(.92)}}

/* ══ SHARDS / PARTÍCULAS ══ */
.shard{position:fixed;bottom:-90px;pointer-events:none;animation:rise linear infinite;z-index:1}
@keyframes rise{to{transform:translateY(-120vh) rotate(170deg);opacity:0}}
.dot{position:fixed;border-radius:50%;background:var(--acid);pointer-events:none;z-index:1;animation:dotup linear infinite,twinkle 2.3s ease-in-out infinite}
@keyframes dotup{to{transform:translateY(-114vh)}}
@keyframes twinkle{50%{opacity:.15}}

/* ══ PALCO ══ */
.stage{position:fixed;inset:0;z-index:3}
/* ══ LOGO PADRONIZADA: mesmas zonas verticais nas 3 telas (independe do conteúdo) ══ */
.embwrap{position:absolute;top:13%;left:0;right:0;margin:0 auto;width:300px;height:300px;display:flex;align-items:center;justify-content:center}
.emblem{width:200px;height:200px;animation:breathe 4.2s ease-in-out infinite;position:relative;z-index:2}
@keyframes breathe{
 0%,100%{filter:drop-shadow(-3px 0 0 rgba(var(--toxic-rgb),.30)) drop-shadow(3px 0 0 rgba(var(--acid-rgb),.20)) drop-shadow(0 0 24px rgba(var(--acid-rgb),.30))}
 50%{filter:drop-shadow(-6px 0 0 rgba(var(--toxic-rgb),.5)) drop-shadow(6px 0 0 rgba(var(--acid-rgb),.32)) drop-shadow(0 0 52px rgba(var(--acid-rgb),.55));transform:scale(1.03)}}
.ring{position:absolute;fill:none;opacity:.55}
.r1{width:232px;height:232px;animation:spin 14s linear infinite;stroke:var(--toxic);stroke-width:1.2;stroke-dasharray:12 7}
.r2{width:268px;height:268px;animation:spin 22s linear infinite reverse;stroke:var(--acid);stroke-width:.9;stroke-dasharray:4 10;opacity:.4}
.r3{width:300px;height:300px;animation:spin 9s linear infinite;stroke:rgba(154,166,154,.5);stroke-width:.7;stroke-dasharray:1 14;opacity:.5}
@keyframes spin{to{transform:rotate(360deg)}}

/* ══ WORDMARK + GLITCH ══ */
.wm{position:absolute;top:calc(13% + 316px);left:0;right:0;margin:0 auto;width:max-content;font-family:Orbitron;font-weight:900;font-size:62px;letter-spacing:.085em;padding-left:.085em;color:var(--txt);animation:fadeup .7s .1s both}
.wm b{color:var(--acid);text-shadow:0 0 26px rgba(var(--acid-rgb),.55)}
.wm::before,.wm::after{content:attr(data-text);position:absolute;left:0;top:0;width:100%;opacity:0;pointer-events:none}
.wm::before{color:var(--toxic)}
.wm::after{color:rgba(255,255,255,.4)}
body.glitching .wm::before{opacity:.85;animation:g1 .22s steps(2) both}
body.glitching .wm::after{opacity:.7;animation:g2 .22s steps(2) both}
@keyframes g1{0%{transform:translate(-4px,-2px);clip-path:inset(12% 0 58% 0)}50%{transform:translate(3px,1px);clip-path:inset(62% 0 8% 0)}100%{transform:none;clip-path:inset(40% 0 40% 0)}}
@keyframes g2{0%{transform:translate(4px,2px);clip-path:inset(58% 0 12% 0)}50%{transform:translate(-3px,-1px);clip-path:inset(8% 0 62% 0)}100%{transform:none;clip-path:inset(40% 0 40% 0)}}
body.glitching .stage{animation:stagejit .22s steps(2) both}
@keyframes stagejit{50%{transform:translate(3px,-2px) skewX(.35deg)}}
body.glitching .emblem{animation:eshake .22s steps(2) both}
@keyframes eshake{33%{transform:translate(-5px,2px);filter:drop-shadow(6px 0 0 rgba(var(--toxic-rgb),.6))}66%{transform:translate(4px,-3px);filter:drop-shadow(-6px 0 0 rgba(var(--acid-rgb),.5))}}
body.glitching #rain{animation:rainjit .22s steps(2) both}
@keyframes rainjit{50%{transform:translateX(9px)}}

/* ══ TEXTOS (alinhamento compensado) ══ */
.status{position:absolute;top:calc(13% + 404px);left:0;right:0;margin:0 auto;width:max-content;font-size:27px;font-weight:600;letter-spacing:.55em;text-indent:.55em;color:var(--txt2);text-transform:uppercase;white-space:nowrap;animation:fadeup .7s .2s both,flick 6.5s 1.5s ease-in-out infinite}
@keyframes flick{48%{opacity:1}50%{opacity:.35}52%{opacity:1}83%{opacity:1}84%{opacity:.55}85%{opacity:1}}
.sub{position:absolute;top:61%;left:0;right:0;margin:0 auto;width:max-content;font-size:26px;font-weight:500;color:var(--txt2);animation:fadeup .7s .3s both}
.count{position:absolute;top:59%;left:0;right:0;margin:0 auto;width:max-content;font-family:Orbitron;font-weight:900;font-size:128px;color:var(--acid);font-variant-numeric:tabular-nums;letter-spacing:.04em;padding-left:.04em;animation:fadeup .7s .25s both;
 text-shadow:-2px 0 0 rgba(var(--toxic-rgb),.25),2px 0 0 rgba(242,255,232,.18),0 0 40px rgba(var(--acid-rgb),.42)}
.count.tick{animation:tickpulse 1s ease-out both}
@keyframes tickpulse{0%{transform:scale(1.06);text-shadow:-6px 0 0 rgba(var(--toxic-rgb),.9),6px 0 0 rgba(242,255,232,.65),0 0 80px rgba(var(--acid-rgb),.85)}
 100%{transform:scale(1);text-shadow:-2px 0 0 rgba(var(--toxic-rgb),.25),2px 0 0 rgba(242,255,232,.18),0 0 40px rgba(var(--acid-rgb),.42)}}
.count.end{font-size:54px;letter-spacing:.14em;padding-left:.14em;text-shadow:0 0 34px rgba(var(--acid-rgb),.7)}
.chips{position:absolute;bottom:11%;left:0;right:0;margin:0 auto;width:max-content;display:flex;flex-wrap:wrap;justify-content:center;gap:16px;animation:fadeup .7s .45s both}
.chip{border:1px solid var(--toxic);background:rgba(18,23,18,.86);color:var(--txt);padding:10px 22px;font-size:20px;font-weight:600;letter-spacing:.12em;padding-left:calc(22px + .12em);clip-path:polygon(11px 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%,0 11px)}
.chip b{color:var(--acid)}
@keyframes fadeup{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* ══ IGNIÇÃO ══ */
.flash{position:fixed;inset:0;z-index:9;opacity:0;pointer-events:none;background:radial-gradient(circle at 50% 45%,rgba(var(--acid-rgb),.32) 0%,transparent 62%)}
body.ignite .flash{animation:flash .95s ease-out both}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
body.ignite .stage{animation:shake .55s ease-out}
@keyframes shake{0%{transform:translate(7px,-5px)}20%{transform:translate(-6px,4px)}40%{transform:translate(5px,3px) skewX(.4deg)}60%{transform:translate(-4px,-2px)}80%{transform:translate(2px,1px)}100%{transform:none}}
body.ignite .r1{animation-duration:1.2s}
body.ignite .r2{animation-duration:2s}
body.ignite .r3{animation-duration:.7s}
body.ignite .flow{animation-duration:.9s,1.1s}
body.ignite .beam{animation-duration:1.8s}
body.ignite .scan{animation-duration:2.2s}
.strobe{position:fixed;inset:0;background:#F2FFE8;opacity:0;z-index:8;pointer-events:none}
/* faixa inferior (6,8vh) reservada ao TICKER · Comandos — nenhum efeito ali */
.fx{position:fixed;inset:0 0 6.8vh 0;overflow:hidden;transform:translateZ(0);z-index:0}




#editor{position:fixed;left:0;right:0;bottom:0;z-index:95;display:none;flex-direction:column;
 background:rgba(6,8,6,.96);border-top:2px solid var(--acid);padding:14px 18px 18px;color:#F2FFE8;
 font-family:Chakra,monospace;max-height:52vh;overflow:auto;pointer-events:auto}
#editor.on{display:flex}
#editor.on{display:flex}
#editor .etag{font:900 20px/1 Orbitron,sans-serif;color:var(--acid);letter-spacing:.16em;margin-bottom:8px}
#editor .frow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
#editor .fbtn{padding:8px 12px;font:700 13px Chakra,monospace;letter-spacing:.08em;cursor:pointer;
 background:transparent;color:var(--acid);border:1px solid rgba(var(--acid-rgb),.45)}

const EXO_THEMES=[{id:"lime",n:"VERDE LIMAO",acid:"#B4FF00",rgb:"180,255,0",toxic:"#5C9900",trgb:"92,153,0"},{id:"blue",n:"AZUL",acid:"#3DA9FC",rgb:"61,169,252",toxic:"#155A99",trgb:"21,90,153"},{id:"cyan",n:"CIANO",acid:"#00E5FF",rgb:"0,229,255",toxic:"#007A88",trgb:"0,122,136"},{id:"purple",n:"ROXO",acid:"#5B21B6",rgb:"91,33,182",toxic:"#2E1065",trgb:"46,16,101"},{id:"red",n:"VERMELHO",acid:"#FF4D4D",rgb:"255,77,77",toxic:"#990000",trgb:"153,0,0"},{id:"orange",n:"LARANJA",acid:"#FF9F1C",rgb:"255,159,28",toxic:"#A35A00",trgb:"163,90,0"},{id:"pink",n:"ROSA",acid:"#FF5C8A",rgb:"255,92,138",toxic:"#A01D4A",trgb:"160,29,74"},{id:"gold",n:"DOURADO",acid:"#FFD166",rgb:"255,209,102",toxic:"#8A6A00",trgb:"138,106,0"},{id:"white",n:"BRANCO",acid:"#F2FFE8",rgb:"242,255,232",toxic:"#9AA69A",trgb:"154,166,154"}];
function exoApplyTheme(id){
  var t=EXO_THEMES[0];
  for(var i=0;i<EXO_THEMES.length;i++) if(EXO_THEMES[i].id===id) t=EXO_THEMES[i];
  var r=document.documentElement;
  r.style.setProperty("--acid", t.acid);
  r.style.setProperty("--toxic", t.toxic);
  r.style.setProperty("--acid-rgb", t.rgb);
  r.style.setProperty("--toxic-rgb", t.trgb||t.rgb);
  return t.id;
}
function exoBuildThemes(hostId, current, onpick){
  var host=document.getElementById(hostId); if(!host) return;
  host.innerHTML="";
  EXO_THEMES.forEach(function(t){
    var b=document.createElement("button"); b.type="button"; b.className="fbtn tbtn"; b.textContent=t.n;
    b.style.borderColor=t.acid; b.style.color=(current===t.id)?"#060806":t.acid;
    if(current===t.id){ b.classList.add("active"); b.style.background=t.acid; }
    else { b.style.background="transparent"; }
    b.onclick=function(){ onpick(t.id); };
    host.appendChild(b);
  });
}

(function(){
const KEY="exoTelaSoonV2";
const DEF={theme:"lime",status:"iniciando em",wm:"<b>EXORI</b>SERVICE",chips:"<b>SEG–SÁB</b> · 08H–22H|TIBIA · RUBINOT",fxint:100,hideLogo:false,mins:10,rain:true,shard:true,dot:true,strobe:true};
let S=Object.assign({},DEF);
try{var v=JSON.parse(localStorage.getItem(KEY)||"null"); if(v) Object.assign(S,v);}catch(e){}
if(S.rain==null) S.rain=true;
if(S.shard==null) S.shard=true;
if(S.dot==null) S.dot=true;
if(S.strobe==null) S.strobe=true;
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function setBtn(id, on){ var b=document.getElementById(id); if(!b) return; b.classList.toggle("active", !!on); }
function applyLive(){
  exoApplyTheme(S.theme||"lime");
  document.documentElement.style.setProperty("--fx-int", String((S.fxint==null?100:S.fxint)/100));
  document.body.classList.toggle("hidelogo", !!S.hideLogo);
  document.body.classList.toggle("norain", S.rain===false);
  document.body.classList.toggle("noshard", S.shard===false);
  document.body.classList.toggle("nodot", S.dot===false);
  document.body.classList.toggle("nostrobe", S.strobe===false);
  var st=document.getElementById("status"); if(st && S.status!=null) st.textContent=S.status;
  var wm=document.querySelector(".wm"); if(wm && S.wm){ wm.innerHTML=S.wm; wm.setAttribute("data-text", (wm.textContent||"").trim()); }
  var sub=document.querySelector(".sub"); if(sub && S.sub!=null) sub.textContent=S.sub;
  var chips=document.querySelector(".chips");
  if(chips && S.chips!=null){
    chips.innerHTML="";
    String(S.chips).split("|").map(function(x){return x.trim()}).filter(Boolean).forEach(function(c){
      var d=document.createElement("div"); d.className="chip"; d.innerHTML=c; chips.appendChild(d);
    });
  }
  var fv=document.getElementById("fxintv"); if(fv) fv.textContent=(S.fxint==null?100:S.fxint)+"%";
  var fi=document.getElementById("fxint"); if(fi && document.activeElement!==fi) fi.value=S.fxint==null?100:S.fxint;
  var lg=document.getElementById("b-logo"); if(lg){ lg.textContent=S.hideLogo?"DESLIGADA":"LIGADA"; lg.classList.toggle("active",!S.hideLogo); }
  setBtn("t-rain", S.rain!==false); setBtn("t-shard", S.shard!==false); setBtn("t-dot", S.dot!==false); setBtn("t-strobe", S.strobe!==false);
  function fill(id, val){ var i=document.getElementById(id); if(i && document.activeElement!==i) i.value=val==null?"":val; }
  fill("in-status", S.status); fill("in-wm", S.wm); fill("in-sub", S.sub); fill("in-chips", S.chips); fill("in-mins", S.mins==null?10:S.mins);
}
exoBuildThemes("themerow", S.theme||"lime", function(id){S.theme=id; persist(); applyLive();});
applyLive();
function bind(id, key){ var el=document.getElementById(id); if(!el) return;
  el.addEventListener("input", function(){ S[key]=el.type==="number"? +el.value : el.value; persist(); applyLive(); });
}
bind("in-status","status"); bind("in-wm","wm"); bind("in-sub","sub"); bind("in-chips","chips"); bind("in-mins","mins");
var fi=document.getElementById("fxint");
if(fi) fi.addEventListener("input", function(){ S.fxint=+fi.value; persist(); applyLive(); });
var lg=document.getElementById("b-logo");
if(lg) lg.onclick=function(){ S.hideLogo=!S.hideLogo; persist(); applyLive(); };
function tog(id, key){ var b=document.getElementById(id); if(!b) return;
  b.onclick=function(){ S[key]=S[key]===false; persist(); applyLive(); };
}
tog("t-rain","rain"); tog("t-shard","shard"); tog("t-dot","dot"); tog("t-strobe","strobe");
let editing=false;
function toggle(force){
  if(typeof force==="boolean") editing=force; else editing=!editing;
  document.body.classList.toggle("editing", editing);
  var ed=document.getElementById("editor"); if(ed) ed.classList.toggle("on", editing);
}
function isEditKey(ev){
  var k=(ev.key||"").toLowerCase();
  var c=ev.code||"";
  return k==="e"||c==="KeyE"||ev.keyCode===69||ev.which===69;
}
function onKey(ev){
  var tag=(ev.target && ev.target.tagName)||"";
  if(tag==="INPUT"||tag==="TEXTAREA"){
    if((ev.key||"").toLowerCase()==="escape"||ev.keyCode===27){ ev.target.blur(); toggle(false); }
    return;
  }
  if((ev.key||"").toLowerCase()==="escape"||ev.keyCode===27){ try{ev.preventDefault()}catch(e){} toggle(false); return; }
  if(isEditKey(ev)){ try{ev.preventDefault()}catch(e){} toggle(); }
}
window.addEventListener("keydown", onKey, true);
document.addEventListener("keydown", onKey);
document.addEventListener("keyup", function(ev){ if(isEditKey(ev)) try{ev.preventDefault()}catch(e){} }, true);
document.body.setAttribute("tabindex","0");
document.addEventListener("pointerdown", function(){ try{document.body.focus()}catch(e){} }, true);
try{document.body.focus()}catch(e){}
var bx=document.getElementById("b-exit");
if(bx) bx.onclick=function(){ toggle(false); };
document.addEventListener("dblclick", function(ev){
  if(ev.target && ev.target.closest && ev.target.closest("#editor")) return;
  toggle();
});
})();
