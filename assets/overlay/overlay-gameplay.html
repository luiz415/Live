:root{--acid:#B4FF00;--acid-rgb:180,255,0;--toxic:#5C9900;--txt:#F2FFE8;--txt2:#9AA69A}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:transparent;font-family:Chakra,monospace}

.edge{--ew:2px;position:fixed;inset:0;pointer-events:none;z-index:5;border:none;box-shadow:none;background:transparent}
.edge.ef-none{border:0;box-shadow:none}
.edge.ef-neon{border:var(--ew) solid rgba(var(--acid-rgb),.55);box-shadow:inset 0 0 26px rgba(var(--acid-rgb),.12),0 0 18px rgba(var(--acid-rgb),.18)}
.edge.ef-glow{border:var(--ew) solid var(--acid);box-shadow:inset 0 0 40px rgba(var(--acid-rgb),.22),0 0 28px rgba(var(--acid-rgb),.4)}
.edge.ef-duplo{border:1px solid rgba(var(--acid-rgb),.45);box-shadow:0 0 0 var(--ew) rgba(6,8,6,.95),0 0 0 calc(var(--ew) + 2px) var(--acid),0 0 22px rgba(var(--acid-rgb),.28)}
.edge.ef-chapa{border:var(--ew) solid rgba(210,220,210,.9);box-shadow:inset 0 0 0 2px rgba(6,8,6,.75)}
.edge.ef-fina{border:var(--ew) solid rgba(var(--acid-rgb),.75);box-shadow:none}
.edge.ef-inner{border:none;box-shadow:inset 0 0 0 var(--ew) var(--acid),inset 0 0 28px rgba(var(--acid-rgb),.22)}
.mbar{flex-wrap:wrap;max-width:96vw;row-gap:8px}
.mbar .frow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.mbar .fbtn{width:auto;padding:0 10px;height:30px;font:700 11px/30px Chakra,monospace;letter-spacing:.08em;background:transparent;color:var(--acid);border:1px solid rgba(var(--acid-rgb),.45)}
.mbar .fbtn.on{background:var(--acid);color:#060806}
/* ── QUADRO DA MARCA — móvel/ajustável (tecla E) + efeitos: cometa na borda, glow e shimmer ── */
@property --ma{syntax:'<angle>';initial-value:0deg;inherits:false}

.head{position:fixed;left:32px;bottom:calc(6.8vh + 14px);display:flex;align-items:center;gap:12px;
 padding:0;background:transparent;cursor:default;overflow:visible;
 transform:scale(var(--ms,1));transform-origin:left center}
.head .hin{position:relative;display:flex;align-items:center;padding:10px 20px 10px 16px;
 background:rgba(6,8,6,.88);overflow:hidden}
.head .name{position:relative;font-family:Orbitron,sans-serif;font-weight:900;font-size:22px;
 letter-spacing:.18em;color:var(--txt);text-shadow:0 2px 8px rgba(0,0,0,.85);white-space:nowrap;
 display:flex;align-items:center;z-index:1}
.head .name .n1{color:var(--acid);text-shadow:0 0 12px rgba(var(--acid-rgb),.55)}
.head .name .n2{color:var(--txt)}
.head .hsep{display:inline-block;width:7px;height:7px;margin:0 12px;flex:0 0 7px;
 background:var(--acid);transform:rotate(45deg);
 box-shadow:0 0 10px rgba(var(--acid-rgb),.85)}
/* letra: brilho em varredura infinita (transform, nao background-position) */
.head .name.tx-shine::after,.head .name.tx-gleam::after,.head .name.tx-aurora::after{
  content:'';position:absolute;top:-20%;bottom:-20%;width:45%;left:-50%;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.0) 20%,rgba(255,255,255,.7) 50%,rgba(255,255,255,.0) 80%,transparent);
  animation:sheenx 2.4s linear infinite}
.head .name.tx-gleam::after{width:70%;animation-duration:3.6s;opacity:.85}
.head .name.tx-aurora::after{background:linear-gradient(90deg,transparent,rgba(var(--acid-rgb),0) 15%,rgba(var(--acid-rgb),.85) 50%,rgba(255,255,255,.5) 60%,transparent);animation-duration:2.8s}
@keyframes sheenx{0%{transform:translateX(0)}100%{transform:translateX(280%)}}
.head .name.tx-glow{animation:txglow 2.4s ease-in-out infinite}
@keyframes txglow{0%,100%{text-shadow:0 0 6px rgba(var(--acid-rgb),.3),0 2px 8px #000}50%{text-shadow:0 0 18px rgba(var(--acid-rgb),.9),0 2px 8px #000}}
.head .name.tx-pulse{animation:txpulse 1.8s ease-in-out infinite}
@keyframes txpulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.35)}}
.head .name.tx-none::after{display:none;animation:none}
/* bordas do quadro de texto — SEM clip-path (clip cortava box-shadow) */
.head.hb-comet .hin::before{content:'';position:absolute;inset:0;padding:2px;pointer-events:none;z-index:2;
 background:conic-gradient(from var(--ma),transparent 0deg 160deg,rgba(var(--acid-rgb),.2) 160deg,
  rgba(var(--acid-rgb),.95) 340deg,#fff 350deg,rgba(var(--acid-rgb),.95) 355deg,transparent 360deg);
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
 mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
 -webkit-mask-composite:xor;mask-composite:exclude;
 filter:drop-shadow(0 0 6px rgba(var(--acid-rgb),.7));animation:ma 4.5s linear infinite}
@property --ma{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes ma{to{--ma:360deg}}
.head.hb-neon .hin{box-shadow:inset 0 0 0 2px var(--acid),0 0 16px rgba(var(--acid-rgb),.45)}
.head.hb-glow .hin{box-shadow:inset 0 0 0 2px var(--acid),0 0 28px rgba(var(--acid-rgb),.75);animation:hinglow 2.4s ease-in-out infinite}
@keyframes hinglow{50%{box-shadow:inset 0 0 0 2px var(--acid),0 0 40px rgba(var(--acid-rgb),1)}}
.head.hb-duplo .hin{box-shadow:inset 0 0 0 1px rgba(6,8,6,.9),0 0 0 2px #060806,0 0 0 4px var(--acid)}
.head.hb-pulse .hin{box-shadow:inset 0 0 0 2px var(--acid);animation:hbp 1.8s ease-in-out infinite}
@keyframes hbp{50%{box-shadow:inset 0 0 0 2px var(--acid),0 0 24px rgba(var(--acid-rgb),.9)}}
.head.hb-fina .hin{box-shadow:inset 0 0 0 1px var(--acid)}
.head.hb-none .hin{box-shadow:none}
.editing .head{cursor:grab;outline:2px dashed rgba(var(--acid-rgb),.9);outline-offset:4px;animation:none}
.editing .head:active{cursor:grabbing}
.mbar{position:fixed;top:12px;left:50%;transform:translateX(-50%);display:none;z-index:50;
 align-items:center;gap:8px;background:rgba(6,8,6,.95);border:1px solid var(--acid);
 padding:8px 12px;flex-wrap:wrap;max-width:96vw;white-space:normal}
.editing .mbar{display:flex}
.mbar .lbl{color:#9AA69A;font-size:11px;letter-spacing:.05em}
.mbar button{width:32px;height:32px;border:0;background:var(--acid);color:#060806;
 font:700 17px/32px monospace;cursor:pointer;padding:0}
.mbar button:active{transform:scale(.92)}
.mbar input[type=range]{width:170px;accent-color:var(--acid);cursor:pointer}
.mbar input[type=text]{width:220px;background:#060806;border:1px solid var(--acid);color:var(--txt);
 font:700 12px Orbitron,sans-serif;padding:6px 8px;letter-spacing:.06em}
.mbar .val{color:var(--acid);font:600 13px/1 monospace;min-width:44px;text-align:center}
.mbar .rst{width:auto;padding:0 10px;font:600 11px/32px monospace;letter-spacing:.08em}
.ticker{position:fixed;left:0;right:0;height:var(--th,56px);display:flex;top:0;border-top:1px solid rgba(92,153,0,.75);border-bottom:1px solid rgba(92,153,0,.55);background:rgba(6,8,6,.68)}
.ticker .zone{flex:1;overflow:hidden;display:flex;align-items:center}
.ticker .roll{display:inline-flex;align-items:center;white-space:nowrap;font-size:calc(var(--th,56px)*.32);letter-spacing:.06em;color:#CBD6CB;text-shadow:0 1px 5px rgba(0,0,0,.95);will-change:transform}
.roll b:first-of-type{text-shadow:0 0 .4em rgba(var(--acid-rgb),.6),0 0 1.1em rgba(var(--acid-rgb),.3)}
.roll b:last-of-type{color:var(--acid);margin:0 .6em 0 .45em;text-shadow:0 0 .5em rgba(var(--acid-rgb),.7)}
.roll i{font-style:normal;font-weight:700;font-size:.9em;color:#060806;background:var(--acid);
 display:inline-block;vertical-align:middle;padding:.14em .68em .14em calc(.68em + .14em);letter-spacing:.1em;
 clip-path:polygon(.45em 0,100% 0,100% calc(100% - .45em),calc(100% - .45em) 100%,0 100%,0 .45em);
 box-shadow:0 0 .55em rgba(var(--acid-rgb),.5)}
.roll .it{flex:0 0 auto;white-space:nowrap}
.roll .it>b:first-of-type{color:var(--acid);margin-right:.35em}
.roll strong{font-weight:600;color:#F2FFE8;text-shadow:0 .08em .25em rgba(0,0,0,.95)}
.roll em{font-style:normal;font-size:.72em;color:var(--toxic);margin:0 .6em;
 text-shadow:0 0 .5em rgba(92,153,0,.8)}
.roll .sep{display:inline-flex;align-items:center;flex:0 0 auto;margin:0 2.2em}
.roll .sep::before,.roll .sep::after{content:'';width:2em;height:.13em;border-radius:.1em}
.roll .sep::before{background:linear-gradient(90deg,transparent,rgba(var(--acid-rgb),.8))}
.roll .sep::after{background:linear-gradient(90deg,rgba(var(--acid-rgb),.8),transparent)}
.roll .sep .dm{width:.56em;height:.56em;background:var(--acid);border-radius:.13em;transform:rotate(45deg);
 margin:0 .75em;box-shadow:0 0 .55em rgba(var(--acid-rgb),.85),0 0 1.3em rgba(var(--acid-rgb),.3);
 animation:dpulse 2.8s ease-in-out infinite}
.roll .sep .sd{width:.22em;height:.22em;background:var(--toxic);border-radius:.05em;transform:rotate(45deg);
 margin:0 .55em;box-shadow:0 0 .4em rgba(92,153,0,.95)}
.roll .sep:nth-of-type(odd) .dm{animation-delay:-1.4s}
@keyframes dpulse{50%{box-shadow:0 0 .95em rgba(var(--acid-rgb),1),0 0 2.1em rgba(var(--acid-rgb),.45);transform:rotate(45deg) scale(1.14)}}
.roll .unit{display:inline-flex;align-items:center;flex:0 0 auto}
</style></head><body>

document.documentElement.style.setProperty('--th',(CFG.alturaTicker||56)+'px');

var W=unit.getBoundingClientRect().width||1;
var need=Math.max(2,Math.ceil((innerWidth+W*2)/W));
for(var k=1;k<need;k++)roll.appendChild(unit.cloneNode(true));
/* ══ RODAPÉ INFINITO REAL ══ A largura dos anúncios muda quando a fonte embutida
   termina de carregar (ou ao redimensionar). Sem re-medir, o período fica velho e a
   emenda "pula". Re-medimos preservando a FASE (rx proporcional) → nunca há salto. */
function remeasure(){var w=unit.getBoundingClientRect().width;if(!(w>1))return;
 if(Math.abs(w-W)>.5){rx=rx*w/W;W=w}
 var n=Math.max(2,Math.ceil((innerWidth+W*2)/W));
 while(roll.children.length<n)roll.appendChild(unit.cloneNode(true))}
var SPD=85,rx=0,prv=performance.now();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(remeasure);
addEventListener('resize',remeasure);setInterval(remeasure,2000);
(function loop(now){var dt=Math.min(.05,(now-prv)/1000);prv=now;
 rx=(rx+SPD*dt)%W;if(!isFinite(rx))rx=0;
 roll.style.transform='translate3d(-'+rx+'px,0,0)';
 requestAnimationFrame(loop)})(prv);
/* ── QUADRO DA MARCA: modo edição (E) — painel + slider + scroll + arrastar ── */
(function(){
var h=document.getElementById('head'),rng=document.getElementById('mrng'),val=document.getElementById('mval');

const EXO_THEMES=[{id:"lime",n:"VERDE LIMAO",acid:"#B4FF00",rgb:"180,255,0",toxic:"#5C9900"},{id:"blue",n:"AZUL",acid:"#3DA9FC",rgb:"61,169,252",toxic:"#155A99"},{id:"cyan",n:"CIANO",acid:"#00E5FF",rgb:"0,229,255",toxic:"#007A88"},{id:"purple",n:"ROXO",acid:"#B388FF",rgb:"179,136,255",toxic:"#5A2D9E"},{id:"red",n:"VERMELHO",acid:"#FF4D4D",rgb:"255,77,77",toxic:"#990000"},{id:"orange",n:"LARANJA",acid:"#FF9F1C",rgb:"255,159,28",toxic:"#A35A00"},{id:"pink",n:"ROSA",acid:"#FF5C8A",rgb:"255,92,138",toxic:"#A01D4A"},{id:"gold",n:"DOURADO",acid:"#FFD166",rgb:"255,209,102",toxic:"#8A6A00"},{id:"white",n:"BRANCO",acid:"#F2FFE8",rgb:"242,255,232",toxic:"#9AA69A"}];
function exoApplyTheme(id){
  var t=EXO_THEMES[0];
  for(var i=0;i<EXO_THEMES.length;i++) if(EXO_THEMES[i].id===id) t=EXO_THEMES[i];
  var r=document.documentElement;
  r.style.setProperty("--acid", t.acid);
  r.style.setProperty("--toxic", t.toxic);
  r.style.setProperty("--acid-rgb", t.rgb);
  return t.id;
}
function exoBuildThemes(hostId, current, onpick){
  var host=document.getElementById(hostId); if(!host) return;
  host.innerHTML="";
  EXO_THEMES.forEach(function(t){
    var b=document.createElement("button"); b.type="button"; b.className="fbtn tbtn"; b.textContent=t.n;
    b.style.borderColor=t.acid; b.style.color=(current===t.id)?"#060806":t.acid;
    if(current===t.id){ b.classList.add("active"); b.style.background=t.acid; }
    else { b.style.background="transparent"; }
    b.onclick=function(){ onpick(t.id); };
    host.appendChild(b);
  });
}

var KEY='exoMarca',S=null;
try{S=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
function sc(){return parseFloat(getComputedStyle(h).getPropertyValue('--ms'))||1}
function apply(){if(!S)return;h.style.left=S.x+'%';h.style.top=S.y+'%';h.style.bottom='auto';
 h.style.setProperty('--ms',S.s);applyEdge();applyHb()}
function pct(){return{x:h.offsetLeft/innerWidth*100,y:h.offsetTop/innerHeight*100}}
function save(){S={x:pct().x,y:pct().y,s:sc(),edge:EDGE,ew:EW,theme:THEME,hbedge:HBEDGE,label:LABEL,txfx:TXFX};try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function syncUI(){var p=Math.round(sc()*100);rng.value=p;val.textContent=p+'%'}
function setS(v){v=Math.min(200,Math.max(60,v));h.style.setProperty('--ms',(v/100).toFixed(2));syncUI();save()}

var EDGES=[{id:'none',n:'SEM'},{id:'neon',n:'NEON'},{id:'glow',n:'GLOW'},{id:'duplo',n:'DUPLO'},{id:'chapa',n:'CHAPA'},{id:'fina',n:'FINA'},{id:'inner',n:'INTERNA'}];
var EDGE=(S&&S.edge&&S.edge!=='hazard')?S.edge:'neon', EW=Math.max(1,Math.min(16,(S&&S.ew)||2));
var THEME=(S&&S.theme)||'lime'; exoApplyTheme(THEME);
function pickTheme(id){THEME=id; exoApplyTheme(id); exoBuildThemes('themerow', id, pickTheme); save();}
setTimeout(function(){exoBuildThemes('themerow', THEME, pickTheme)},0);
var HBEDGES=[{id:'comet',n:'COMETA'},{id:'neon',n:'NEON'},{id:'glow',n:'GLOW'},{id:'duplo',n:'DUPLO'},{id:'pulse',n:'PULSO'},{id:'fina',n:'FINA'},{id:'none',n:'SEM'}];
var HBEDGE=(S&&S.hbedge)||'comet';
var LABEL=(S&&S.label)||'EXORISERVICE - LUIZ';
var TXFX=(S&&S.txfx)||'shine';
var TXFXS=[{id:'shine',n:'BRILHO'},{id:'gleam',n:'REFLEXO'},{id:'aurora',n:'AURORA'},{id:'glow',n:'GLOW'},{id:'pulse',n:'PULSO'},{id:'none',n:'SEM'}];
function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]);});}
function renderName(){
  var el=document.getElementById('hname'); if(!el)return;
  var raw=LABEL||'EXORISERVICE - LUIZ';
  var parts=raw.split(/\s*[-–—·|]\s*/);
  var html;
  if(parts.length>=2){ html='<span class="n1">'+esc(parts.slice(0,-1).join(' '))+'</span><span class="hsep"></span><span class="n2">'+esc(parts[parts.length-1])+'</span>'; }
  else { html='<span class="n1">'+esc(raw)+'</span>'; }
  el.innerHTML=html;
  TXFXS.forEach(function(f){el.classList.toggle('tx-'+f.id, f.id===TXFX)});
}
function applyHb(){
  var h=document.getElementById('head'); if(!h)return;
  HBEDGES.forEach(function(e){h.classList.toggle('hb-'+e.id, e.id===HBEDGE)});
  document.querySelectorAll('#hbrow .fbtn').forEach(function(b){b.classList.toggle('on', b.dataset.e===HBEDGE)});
  renderName();
}

(function(){
  var host=document.getElementById('hbrow'); if(!host)return;
  HBEDGES.forEach(function(e){
    var b=document.createElement('button'); b.type='button'; b.className='fbtn'; b.textContent=e.n; b.dataset.e=e.id;
    b.onclick=function(){HBEDGE=e.id; applyHb(); save();};
    host.appendChild(b);
  });
  applyHb();
})();
(function(){
  var host=document.getElementById('txrow'); if(!host)return;
  TXFXS.forEach(function(e){
    var b=document.createElement('button'); b.type='button'; b.className='fbtn'; b.textContent=e.n; b.dataset.e=e.id;
    b.onclick=function(){TXFX=e.id; applyHb(); save();
      host.querySelectorAll('.fbtn').forEach(function(x){x.classList.toggle('on', x.dataset.e===TXFX)});};
    host.appendChild(b);
  });
  host.querySelectorAll('.fbtn').forEach(function(x){x.classList.toggle('on', x.dataset.e===TXFX)});
})();
var htxt=document.getElementById('htxt');
if(htxt){ htxt.value=LABEL; htxt.addEventListener('input',function(){LABEL=this.value.slice(0,48); renderName();}); htxt.addEventListener('change',function(){save();}); }
var edgeEl=document.getElementById('edge');
function applyEdge(){
  if(!edgeEl)return;
  EDGES.forEach(function(e){edgeEl.classList.toggle('ef-'+e.id,e.id===EDGE)});
  edgeEl.style.setProperty('--ew',EW+'px');
  document.querySelectorAll('#eframes .fbtn').forEach(function(b){b.classList.toggle('on',b.dataset.e===EDGE)});
  var ev=document.getElementById('ewval'); if(ev) ev.textContent=EW+'px';
  var er=document.getElementById('ewrng'); if(er) er.value=EW;
}
(function(){
  var host=document.getElementById('eframes'); if(!host)return;
  EDGES.forEach(function(e){
    var b=document.createElement('button'); b.type='button'; b.className='fbtn'; b.textContent=e.n; b.dataset.e=e.id;
    b.onclick=function(){EDGE=e.id; applyEdge(); save();};
    host.appendChild(b);
  });
})();
var ewr=document.getElementById('ewrng');
if(ewr) ewr.addEventListener('input',function(){EW=+this.value; applyEdge(); save();});
applyEdge();

apply();
var edit=false;
function toggle(){edit=!edit;document.body.classList.toggle('editing',edit);if(edit)syncUI()}
addEventListener('keydown',function(e){
 var k=e.key.toLowerCase();
 if(k==='e'){toggle();return}
 if(!edit)return;
 if(k==='escape'){toggle()}
 else if(k==='+'||k==='='){setS(sc()*100+5)}
 else if(k==='-'||k==='_'){setS(sc()*100-5)}
 else if(k==='r'){try{localStorage.removeItem(KEY)}catch(x){}location.reload()}
 else if(k.indexOf('arrow')===0){var p=pct(),d=e.shiftKey?2:.5;
  if(k==='arrowleft')h.style.left=(p.x-d)+'%';
  if(k==='arrowright')h.style.left=(p.x+d)+'%';
  if(k==='arrowup')h.style.top=(p.y-d)+'%';
  if(k==='arrowdown')h.style.top=(p.y+d)+'%';
  save();e.preventDefault()}
});
/* scroll sobre o quadro = tamanho */
h.addEventListener('wheel',function(e){if(!edit)return;e.preventDefault();
 setS(sc()*100+(e.deltaY<0?5:-5))},{passive:false});
rng.addEventListener('input',function(){setS(+rng.value)});
function hold(id,fn){var b=document.getElementById(id),iv=null;
 function stop(){if(iv){clearInterval(iv);iv=null}}
 b.addEventListener('pointerdown',function(e){e.preventDefault();fn();iv=setInterval(fn,110)});
 ['pointerup','pointerleave','pointercancel'].forEach(function(ev){b.addEventListener(ev,stop)})}
hold('msub',function(){setS(sc()*100-5)});
hold('madd',function(){setS(sc()*100+5)});
document.getElementById('mrst').onclick=function(){try{localStorage.removeItem(KEY)}catch(x){}location.reload()};
h.addEventListener('pointerdown',function(e){
 if(!edit)return;e.preventDefault();try{h.setPointerCapture(e.pointerId)}catch(x){}
 var p=pct(),sx=e.clientX,sy=e.clientY;
 function mv(e2){h.style.left=(p.x+(e2.clientX-sx)/innerWidth*100)+'%';
  h.style.top=(p.y+(e2.clientY-sy)/innerHeight*100)+'%';h.style.bottom='auto'}
 function up(){save();removeEventListener('pointermove',mv);removeEventListener('pointerup',up)}
 addEventListener('pointermove',mv);addEventListener('pointerup',up)});
})();
</script></body></html>
