<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<title>Cobertura · Chat do Jogo — exoriservice</title><style>
:root{--acid:#B4FF00}
*{margin:0;padding:0;box-sizing:border-box}
/* leve relâmpago */
.cover::after{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 60% 40% at 50% 30%,rgba(255,255,255,.0) 0%,rgba(255,255,255,.0) 100%);mix-blend-mode:screen;animation:flash 7.3s linear infinite;z-index:9}
@keyframes flash{0%,92%,100%{opacity:0;background:radial-gradient(ellipse 60% 40% at 50% 30%,rgba(255,255,255,0) 0%,rgba(255,255,255,0) 100%)}
 93%{opacity:.9;background:radial-gradient(ellipse 60% 40% at 50% 30%,rgba(220,255,220,.22) 0%,rgba(180,255,0,.08) 45%,transparent 80%)}
 93.6%{opacity:.25}
 94.2%{opacity:.75;background:radial-gradient(ellipse 65% 45% at 45% 20%,rgba(255,255,255,.18) 0%,rgba(180,255,0,.06) 50%,transparent 85%)}
 94.8%{opacity:0}}
html,body{width:100%;height:100%;overflow:hidden;background:transparent}

/* ══ fundo único bem escuro (privacidade total) ══ */
.cover{position:fixed;inset:0;background:rgba(6,8,6,.100)}

/* ══ EFEITOS (todos dinâmicos — nenhum elemento fixo) ══ */
.fx{position:fixed;inset:0;overflow:hidden;pointer-events:none}

/* ── CHUVA: 3 camadas de profundidade, inclinada pelo vento ── */
.drop{position:absolute;top:-18%;border-radius:2px;
 background:linear-gradient(180deg,transparent,rgba(190,255,10,var(--op)));
 animation:fall linear infinite}
@keyframes fall{
 from{transform:translateY(-18vh) rotate(var(--ra))}
 to{transform:translateY(138vh) rotate(var(--ra))}}

/* ── VAGALUMES: pontos de luz flutuando devagar, piscando ── */
.ff{position:absolute;width:var(--s);height:var(--s);border-radius:50%;
 background:rgba(198,255,30,.95);box-shadow:0 0 calc(var(--s)*2.6) rgba(180,255,0,.8);
 animation:drift var(--dd) ease-in-out infinite alternate,ffpulse var(--pp) ease-in-out infinite;
 opacity:0}
@keyframes drift{
 from{transform:translate(0,0)}
 to{transform:translate(var(--dx),var(--dy))}}
@keyframes ffpulse{0%,100%{opacity:.06}45%{opacity:var(--pk)}60%{opacity:.25}}

/* ── POEIRA LUMINOSA: partículas mínimas subindo com balanço ── */
.dust{position:absolute;bottom:-3%;width:var(--s);height:var(--s);border-radius:50%;
 background:rgba(180,255,0,var(--op));
 animation:rise var(--rd) linear infinite,sway var(--sd) ease-in-out infinite alternate}
@keyframes rise{to{transform:translateY(-116vh)}}
@keyframes sway{from{margin-left:0}to{margin-left:14px}}

/* ── NÉVOA SUTIL: dois véus respirando em direções opostas ── */
.mist{position:absolute;width:70vw;height:60vh;border-radius:50%;
 background:radial-gradient(ellipse,rgba(30,54,7,.55),transparent 65%);
 filter:blur(30px);opacity:.14;animation:mdrift 36s ease-in-out infinite alternate}
@keyframes mdrift{from{transform:translate(-4%,3%) scale(1)}to{transform:translate(5%,-4%) scale(1.15)}}

.mark{position:fixed;right:12px;bottom:10px;display:flex;align-items:center;gap:8px;opacity:.5}
.mark img{width:26px;height:26px;filter:grayscale(.2) brightness(1.1)}
.mark span{font-family:Chakra,monospace;font-size:11px;letter-spacing:.22em;color:#9AA69A}
</style></head><body>
<div class="cover" id="cover"><div class="fx" id="fx"></div></div>
<script>
/* ═══ CONFIGURAÇÃO RÁPIDA (edite aqui) ═══
   forca ......... 0 a 1 — opacidade da cor única do fundo (padrão .100)
   chuva ......... nº TOTAL de gotas em 3 planos (0 desativa · padrão 72)
   vento ......... inclinação das gotas em graus (padrão 12)
   vagalumes .... nº de vagalumes (0 desativa · padrão 9)
   poeira ....... nº de partículas de poeira (0 desativa · padrão 14)
   nevoa ......... true/false — véus de névoa respirando ao fundo
   marca ......... true/false — mini-assinatura no canto            */
const CFG={forca:1,chuva:72,vento:12,vagalumes:9,poeira:14,nevoa:true,marca:false};

document.getElementById('cover').style.background='rgba(6,8,6,'+CFG.forca+')';
var fx=document.getElementById('fx');
/* ── CHUVA: planos [longe, meio, perto] — perto = mais grossa, rápida e viva ── */
var PLANOS=[
 {n:.42,w:1,  h:[10,17],op:[.10,.20],du:[2.6,3.5]},
 {n:.36,w:2,  h:[15,26],op:[.22,.38],du:[1.8,2.5]},
 {n:.22,w:3,  h:[24,40],op:[.42,.62],du:[1.1,1.7],blur:.4}];
PLANOS.forEach(function(p){
 var q=Math.round(CFG.chuva*p.n);
 for(var i=0;i<q;i++){
  var d=document.createElement('i');d.className='drop';
  var h=p.h[0]+Math.random()*(p.h[1]-p.h[0]);
  var op=p.op[0]+Math.random()*(p.op[1]-p.op[0]);
  var du=p.du[0]+Math.random()*(p.du[1]-p.du[0]);
  var ra=(CFG.vento+(Math.random()*4-2));
  d.style.cssText='left:'+(-6+Math.random()*112)+'%;width:'+p.w+'px;height:'+h+'px;'
   +'--op:'+op.toFixed(2)+';--ra:'+ra.toFixed(1)+'deg;'
   +'animation-duration:'+du.toFixed(2)+'s;animation-delay:-'+(Math.random()*4).toFixed(2)+'s'
   +(p.blur?';filter:blur(.4px)':'');
  fx.appendChild(d)}});
/* ── VAGALUMES: deriva lenta + pulso de brilho orgânico ── */
for(var f=0;f<CFG.vagalumes;f++){
 var v=document.createElement('i');v.className='ff';
 var s=3+Math.random()*3.5;
 v.style.cssText='left:'+(4+Math.random()*92)+'%;top:'+(10+Math.random()*78)+'%;'
  +'--s:'+s.toFixed(1)+'px;--pk:'+(.55+Math.random()*.4).toFixed(2)+';'
  +'--dx:'+((Math.random()*120-60)).toFixed(0)+'px;--dy:'+((Math.random()*80-40)).toFixed(0)+'px;'
  +'--dd:'+(11+Math.random()*14).toFixed(1)+'s;--pp:'+(2.6+Math.random()*3.4).toFixed(1)+'s;'
  +'animation-delay:-'+(Math.random()*12).toFixed(1)+'s,-'+(Math.random()*4).toFixed(1)+'s';
 fx.appendChild(v)}
/* ── POEIRA LUMINOSA: sobe devagar balançando ── */
for(var u=0;u<CFG.poeira;u++){
 var t=document.createElement('i');t.className='dust';
 t.style.cssText='left:'+(Math.random()*100)+'%;--s:'+(1.6+Math.random()*2.2).toFixed(1)+'px;'
  +'--op:'+(.12+Math.random()*.22).toFixed(2)+';';
 var rd=16+Math.random()*18, sd=3+Math.random()*4;
 t.style.animationDuration=rd.toFixed(1)+'s,'+sd.toFixed(1)+'s';
 t.style.animationDelay='-'+(Math.random()*20).toFixed(1)+'s,0s';
 fx.appendChild(t)}
/* ── NÉVOA: dois véus em pontos opostos ── */
if(CFG.nevoa){
 var m1=document.createElement('i');m1.className='mist';
 m1.style.cssText='left:-12vw;top:-14vh';
 var m2=document.createElement('i');m2.className='mist';
 m2.style.cssText='right:-14vw;bottom:-18vh;animation-duration:44s;animation-delay:-18s';
 fx.appendChild(m1);fx.appendChild(m2)}
</script></body></html>
