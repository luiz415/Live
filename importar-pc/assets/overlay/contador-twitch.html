<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<title>Contador de Espectadores — Twitch</title>
<style>
/* CONTADOR DE ESPECTADORES DA TWITCH (apenas Twitch, sem YouTube/Kick)
   Consome http://127.0.0.1:7777/twitch-viewers (proxy local em
   integracoes/twitch-contador-server.js). Não há token/segredo aqui.

   Estados visuais:
     • carregando  → "···" em títulos, sem número
     • online      → número grande em verde-ácido, com glow
     • offline     → "OFFLINE" cinza (transmissão fechada)
     • erro        → "indisponível" cinza (sem inventar número)
   Atualiza a cada 30 s. Em caso de erro, retenta em 15 s. */
:root{--acid:#B4FF00;--toxic:#5C9900;--bg:#060806;--txt:#F2FFE8;--txt2:#9AA69A}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:transparent;font-family:"Chakra Petch",Chakra,monospace}
.wrap{position:fixed;display:inline-flex;align-items:center;gap:10px;
 background:rgba(6,8,6,.78);border:1px solid rgba(180,255,0,.5);
 padding:7px 12px 7px calc(12px + .22em);white-space:nowrap;
 clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
 backdrop-filter:blur(2px);animation:cpulse 3.4s ease-in-out infinite}
@keyframes cpulse{50%{box-shadow:0 0 14px rgba(180,255,0,.25)}}
.dot{width:8px;height:8px;background:#5C9900;border-radius:50%;transition:background .3s}
.dot.live{background:var(--acid);box-shadow:0 0 8px var(--acid);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.35}}
.eye{display:flex;align-items:center;gap:6px;font:600 11px/1 Chakra,monospace;letter-spacing:.22em;color:var(--txt2)}
.icon{width:14px;height:14px;display:inline-block}
.num{font-family:Orbitron,monospace;font-weight:900;font-size:22px;letter-spacing:.08em;
 color:var(--acid);text-shadow:0 0 12px rgba(180,255,0,.55);min-width:54px;text-align:right}
.num.empty{color:var(--toxic);text-shadow:none}
.label{font:600 10px/1 Chakra,monospace;letter-spacing:.28em;color:var(--txt2);text-transform:uppercase}
.off{font:700 11px/1 Orbitron,monospace;letter-spacing:.2em;color:var(--txt2);opacity:.7}
.err{font:700 11px/1 Orbitron,monospace;letter-spacing:.16em;color:#FFC107;opacity:.85}
</style></head><body>
<div class="wrap" id="w">
  <span class="eye" title="Twitch">
    <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M4 2h17v13l-5 5h-4l-3 3H6v-3H2V5l2-3zm16 11V4H6v12h4v3l3-3h4l3-3zm-6-7h2v5h-2V6zm-5 0h2v5H9V6z"/>
    </svg>
    <span class="label">AO VIVO</span>
  </span>
  <span class="dot" id="dot"></span>
  <span class="num" id="n">···</span>
  <span class="label">ESPECTADORES</span>
</div>
<script>
"use strict";
const ENDPOINT = "http://127.0.0.1:7777/twitch-viewers";   // proxy local
const NORMAL_MS = 30000;                                   // limite da API: ok
const RETRY_MS  = 15000;
let mode = "loading";                                      // loading | online | offline | error

function setMode(m){ mode = m;
  const dot = document.getElementById("dot"), n = document.getElementById("n"), w = document.getElementById("w");
  dot.classList.toggle("live", m === "online");
  if (m === "loading") { n.textContent = "···"; n.className = "num empty"; w.title = "carregando Twitch…"; }
  else if (m === "online") { /* n definido pelo render */ n.className = "num"; w.title = "transmissão ao vivo"; }
  else if (m === "offline") { n.textContent = "OFFLINE"; n.className = "num empty"; w.title = "canal offline"; }
  else { n.textContent = "indisp."; n.className = "num empty"; w.title = "indisponível — sem dados"; }
}

function fmt(n){ if (n < 1000) return String(n);
  if (n < 10000) return (n/1000).toFixed(n%1000===0?1:2).replace(".",",") + "k";
  if (n < 1000000) return Math.round(n/1000) + "k";
  return (n/1000000).toFixed(1).replace(".",",") + "M"; }

async function tick(){
  try{
    const r = await fetch(ENDPOINT, { cache: "no-store" });
    if (!r.ok) throw new Error("http " + r.status);
    const j = await r.json();
    if (j.online) { document.getElementById("n").textContent = fmt(j.viewers || 0); setMode("online"); }
    else { setMode("offline"); }
  }catch(e){ setMode("error"); }
}

/* primeira leitura + ciclo */
tick();
let handle = setInterval(tick, NORMAL_MS);

/* se der erro, encurta o intervalo por 60 s (transient errors) */
let errorSince = 0;
const origSetMode = setMode;
window.addEventListener("online", () => { errorSince = 0; clearInterval(handle); handle = setInterval(tick, NORMAL_MS); tick(); });
window.addEventListener("offline", () => { clearInterval(handle); handle = setInterval(tick, RETRY_MS); });

/* observar mudanças reais no título/jogo (re-fetch em 30s, idem) */
</script></body></html>
