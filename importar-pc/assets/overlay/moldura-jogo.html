:root{--acid:#B4FF00;--toxic:#5C9900;--acid-rgb:180,255,0}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:transparent}
.frame{position:fixed;inset:0;pointer-events:none}

/* ── COMETA: única luz percorrendo o perímetro (volta completa contínua) ──
   monitor/jc: circuito fecha a 6,8vh do fundo → faixa do ticker 100% livre */
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
.ring{position:absolute;inset:0 0 0 0;padding:2px;
 background:conic-gradient(from var(--a),
  transparent 0deg 150deg,
  rgba(var(--acid-rgb),.14) 150deg,
  rgba(var(--acid-rgb),.9) 342deg,
  #F4FFD0 350deg,
  rgba(var(--acid-rgb),.9) 353deg,
  transparent 360deg);
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
 mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
 -webkit-mask-composite:xor;mask-composite:exclude;
 filter:drop-shadow(0 0 6px rgba(var(--acid-rgb),.7));
 animation:orbit 6s linear infinite}
@keyframes orbit{to{--a:360deg}}

/* ── trilho fixo sutil (por onde o cometa corre) ── */
.rail{position:absolute;inset:0 0 0 0;border:1px solid rgba(var(--acid-rgb),.22)}

/* ── brackets nos 4 cantos (px: fonte 480×270; origin no canto p/ não sair do lugar) ── */
.b{position:absolute;width:20px;height:20px;box-sizing:border-box;
  border:2px solid var(--acid);background:transparent;
  filter:drop-shadow(0 0 3px rgba(var(--acid-rgb),.55));
  animation:bpulse 2.2s ease-in-out infinite}
.b1{top:2px;left:2px;border-right:0;border-bottom:0;transform-origin:0 0}
.b2{top:2px;right:2px;border-left:0;border-bottom:0;transform-origin:100% 0;animation-delay:.28s}
.b3{bottom:2px;left:2px;border-right:0;border-top:0;transform-origin:0 100%;animation-delay:.56s}
.b4{bottom:2px;right:2px;border-left:0;border-top:0;transform-origin:100% 100%;animation-delay:.84s}
@keyframes bpulse{50%{opacity:.5}}

.tag{position:absolute;top:1.1vh;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:1vh;
 background:var(--acid);color:#060806;font-family:Chakra;font-weight:600;font-size:2.3vh;
 letter-spacing:.26em;padding:.7vh 2.1vh .7vh calc(2.1vh + .26em);white-space:nowrap;
 clip-path:polygon(.9vh 0,100% 0,100% calc(100% - .9vh),calc(100% - .9vh) 100%,0 100%,0 .9vh);
 box-shadow:0 0 2vh rgba(var(--acid-rgb),.4)}
.tag .dot{width:1.1vh;height:1.1vh;background:#060806;border-radius:50%;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}

.frame.fm-none .ring,.frame.fm-none .rail,.frame.fm-none .b{display:none}
.frame.fm-neon .ring{display:none}
.frame.fm-neon .rail{border:3px solid var(--acid);box-shadow:inset 0 0 24px rgba(var(--acid-rgb),.12)}
.frame.fm-duplo .ring{display:none}
.frame.fm-duplo .rail{border:1px solid rgba(var(--acid-rgb),.4);box-shadow:0 0 0 6px rgba(6,8,6,.9),0 0 0 9px var(--acid)}
.frame.fm-chapa .ring{display:none}
.frame.fm-chapa .rail{border:4px solid rgba(210,220,210,.9)}
.frame.fm-fina .ring{display:none}
.frame.fm-fina .rail{border:2px solid rgba(var(--acid-rgb),.75);box-shadow:none}
.frame.fm-inner .ring{display:none}
.frame.fm-inner .rail{border:none;box-shadow:inset 0 0 0 4px var(--acid),inset 0 0 30px rgba(var(--acid-rgb),.2)}
body.hidetag .tag{display:none}
#editor{position:fixed;inset:auto 0 0 0;z-index:80;display:none;flex-direction:column;
 background:rgba(6,8,6,.94);border-top:1px solid var(--acid);padding:4px 6px 6px;color:#F2FFE8;font-family:Chakra,monospace;max-height:72%;overflow:auto;pointer-events:auto;
 font-size:8px}
#editor.on{display:flex}
#editor .etag{font:900 9px/1.1 Orbitron,sans-serif;color:var(--acid);letter-spacing:.08em;margin-bottom:3px}
#editor .frow{display:flex;flex-wrap:wrap;gap:2px}
#editor .fbtn{padding:2px 5px;font:700 8px/1.2 Chakra,monospace;letter-spacing:.03em;cursor:pointer;
 background:transparent;color:var(--acid);border:1px solid rgba(var(--acid-rgb),.45)}
#editor .fbtn.active{background:var(--acid);color:#060806}
#editor .btn{margin-top:4px;padding:3px 6px;font:700 8px Chakra,monospace;border:0;background:var(--acid);color:#060806;cursor:pointer;width:max-content}
#editor .hint{font-size:7px;color:#9AA69A;margin:0 0 3px}

</style></head><body>
<div class="frame fm-comet" id="frame">
  <div class="rail"></div>
  <div class="ring"></div>
  <div class="b b1"></div><div class="b b2"></div><div class="b b3"></div><div class="b b4"></div>
  <div class="tag"><span class="dot"></span>JOGO</div>
</div>

  <div class="frow" id="themerow"></div>
  <div class="hint" style="margin-top:4px">ETIQUETA</div>

<script>
"use strict";
const EXO_THEMES=[{id:"lime",n:"VERDE LIMAO",acid:"#B4FF00",rgb:"180,255,0",toxic:"#5C9900"},{id:"blue",n:"AZUL",acid:"#3DA9FC",rgb:"61,169,252",toxic:"#155A99"},{id:"cyan",n:"CIANO",acid:"#00E5FF",rgb:"0,229,255",toxic:"#007A88"},{id:"purple",n:"ROXO",acid:"#5B21B6",rgb:"91,33,182",toxic:"#2E1065"},{id:"red",n:"VERMELHO",acid:"#FF4D4D",rgb:"255,77,77",toxic:"#990000"},{id:"orange",n:"LARANJA",acid:"#FF9F1C",rgb:"255,159,28",toxic:"#A35A00"},{id:"pink",n:"ROSA",acid:"#FF5C8A",rgb:"255,92,138",toxic:"#A01D4A"},{id:"gold",n:"DOURADO",acid:"#FFD166",rgb:"255,209,102",toxic:"#8A6A00"},{id:"white",n:"BRANCO",acid:"#F2FFE8",rgb:"242,255,232",toxic:"#9AA69A"}];
function exoApplyTheme(id){
  var t=EXO_THEMES[0];
  for(var i=0;i<EXO_THEMES.length;i++) if(EXO_THEMES[i].id===id) t=EXO_THEMES[i];
  var r=document.documentElement;
  r.style.setProperty("--acid", t.acid);
  r.style.setProperty("--toxic", t.toxic);
  r.style.setProperty("--acid-rgb", t.rgb);
  return t.id;
}
function exoBuildThemes(hostId, current, onpick){
  var host=document.getElementById(hostId); if(!host) return;
  host.innerHTML="";
  EXO_THEMES.forEach(function(t){
    var b=document.createElement("button"); b.type="button"; b.className="fbtn tbtn"; b.textContent=t.n;
    b.style.borderColor=t.acid; b.style.color=(current===t.id)?"#060806":t.acid;
    if(current===t.id){ b.classList.add("active"); b.style.background=t.acid; }
    else { b.style.background="transparent"; }
    b.onclick=function(){ onpick(t.id); };
    host.appendChild(b);
  });
}
const KEY="exoriMoldJogoV1";
const FRAMES=[{id:"comet",name:"COMETA"},{id:"neon",name:"NEON"},{id:"duplo",name:"DUPLO"},{id:"chapa",name:"CHAPA"},{id:"fina",name:"FINA"},{id:"inner",name:"INTERNA"},{id:"none",name:"SEM MOLDURA"}];
let frame="comet", theme="lime", hideTag=false, editing=false;
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&s.frame==="hazard") frame="neon"; else if(s&&FRAMES.some(f=>f.id===s.frame)) frame=s.frame; if(s&&s.theme) theme=s.theme; if(s&&s.hideTag) hideTag=true;}catch(e){}
exoApplyTheme(theme);
function persistMold(){try{localStorage.setItem(KEY,JSON.stringify({frame,theme,hideTag}))}catch(e){}}
function pickTheme(id){theme=id; exoApplyTheme(id); exoBuildThemes("themerow", id, pickTheme); persistMold();}
setTimeout(function(){exoBuildThemes("themerow", theme, pickTheme)},0);
const host=document.getElementById("framerow");
const fr=document.getElementById("frame");
function apply(){
  FRAMES.forEach(f=>fr.classList.toggle("fm-"+f.id,f.id===frame));
  host.querySelectorAll(".fbtn").forEach(b=>b.classList.toggle("active",b.dataset.frame===frame));
  document.body.classList.toggle("hidetag", !!hideTag);
  var tg=document.getElementById("b-tag"); if(tg){ tg.classList.toggle("active", !hideTag); tg.textContent=hideTag?"ETIQUETA OFF":"JOGO"; }
}
FRAMES.forEach(f=>{
  const b=document.createElement("button"); b.type="button"; b.className="fbtn"; b.textContent=f.name; b.dataset.frame=f.id;
  b.onclick=function(){frame=f.id; apply(); persistMold();};
  host.appendChild(b);
});
document.getElementById("b-tag").onclick=function(){ hideTag=!hideTag; apply(); persistMold(); };
function toggle(){
  editing=!editing;
  document.getElementById("editor").classList.toggle("on",editing);
}
document.addEventListener("keydown",function(ev){
  if(ev.key==="Escape"&&editing){ev.preventDefault();toggle();return;}
  if(ev.key==="e"||ev.key==="E"){ev.preventDefault();toggle();}
});
document.getElementById("b-exit").onclick=function(){if(editing)toggle();};
apply();
</script>

</body></html>
